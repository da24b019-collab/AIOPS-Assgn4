# prometheus.yml -- tells Prometheus WHAT to scrape and HOW OFTEN.

global:
  scrape_interval: 5s       # collect metrics every 5 s (matches the 5 s dashboard refresh)
  evaluation_interval: 5s   # how often alert/recording rules are checked

scrape_configs:
  # 1) Prometheus monitoring itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 2) Our Streamlit captioning app (metrics server started in metrics.py)
  - job_name: captioner_app
    static_configs:
      - targets: ["localhost:8000"]

  # 3) System metrics (CPU / RAM / disk) from node_exporter
  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]

